name: bitis
description: >-
  Pure-Dart runtime for bitis, a bit-level serialization format. Web-safe
  (dart2js and dart2wasm). Used by code generated with `bitis -l dart`.
version: 0.11.0
publish_to: none
repository: https://github.com/doheide/bitis

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  fixnum: ^1.1.0

dev_dependencies:
  lints: '>=4.0.0 <7.0.0'
  test: ^1.25.0
